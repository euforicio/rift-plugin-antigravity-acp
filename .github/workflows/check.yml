name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node tooling/check-vendor.mjs
      - run: npm ci --ignore-scripts --include=optional
      - run: npm run typecheck
      - run: npm run build
      - run: node -e 'import("./dist/host.js")'
